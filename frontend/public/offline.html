<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1F17" />
    <title>CleanEat - 오프라인</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { --bg: #f4f8f6; --surface: #ffffff; --text: #0e1f17; --muted: #5c6b62; --brand: #0ea875; color-scheme: light; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #10140f; --surface: #1a201a; --text: #eef1ec; --muted: #a4ada2; --brand: #28c491; color-scheme: dark; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
        background: var(--bg); color: var(--text);
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      }
      main { max-width: 360px; width: 100%; background: var(--surface); border-radius: 16px; padding: 28px 22px; text-align: center; }
      img { width: 64px; height: 64px; }
      h1 { font-size: 1.15rem; margin: 14px 0 8px; }
      p { margin: 0 0 20px; color: var(--muted); font-size: 0.9rem; line-height: 1.6; }
      button {
        width: 100%; padding: 12px; border: none; border-radius: 10px; background: var(--brand);
        color: #ffffff; font-size: 0.95rem; font-weight: 700; cursor: pointer; font-family: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>인터넷에 연결되어 있지 않아요</h1>
      <p>성분 검사와 주문은 인터넷 연결이 필요해요.<br />연결을 확인한 뒤 다시 시도해 주세요.</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>

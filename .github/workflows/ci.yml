# 푸시/PR마다 백엔드 테스트, 프론트 타입체크/린트/빌드, 배포용 Docker 이미지 빌드를 확인한다.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    # 배포 이미지와 같은 Debian 13(trixie)에서 돌린다 - OCR 테스트가 시스템 Tesseract/Leptonica를 쓰는데,
    # ubuntu-latest(24.04)의 Leptonica는 pom의 tess4j가 기대하는 버전보다 낮아서 OCR 테스트가 실패한다.
    container: debian:trixie
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Install JDK 21, Maven, Tesseract
        working-directory: /
        # 폰트 패키지는 OCR 테스트가 글자 이미지를 그릴 때 필요 (headless JDK에는 폰트 라이브러리가 없음)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            openjdk-21-jdk-headless maven libtesseract5 \
            libharfbuzz0b libfreetype6 fontconfig fonts-dejavu-core \
            git ca-certificates curl

      - uses: actions/checkout@v4

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: maven-

      # tessdata는 git에 없다 (.gitignore) - Dockerfile과 같은 파일/체크섬으로 받는다
      - name: Download OCR data (tessdata_fast 4.1.0)
        run: |
          mkdir -p tessdata
          curl -fsSL -o tessdata/eng.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/eng.traineddata
          curl -fsSL -o tessdata/kor.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/kor.traineddata
          echo "7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2  tessdata/eng.traineddata" | sha256sum -c
          echo "6b85e11d9bbf07863b97b3523b1b112844c43e713df8b66418a081fd1060b3b2  tessdata/kor.traineddata" | sha256sum -c

      # 프론트는 frontend 잡에서 따로 확인한다 (skip.frontend.copy=true면 npm 설치/빌드를 건너뜀)
      - name: Test
        run: mvn -B test -Dskip.frontend.copy=true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # pom.xml의 frontend-maven-plugin과 같은 버전
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Vitest + Testing Library (jsdom) - src/**/*.test.ts(x)
      - run: npm test
      # tsc -b && vite build
      - run: npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # 빌드 컨텍스트는 저장소 루트 (Dockerfile이 frontend도 COPY한다)
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: cleaneat:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

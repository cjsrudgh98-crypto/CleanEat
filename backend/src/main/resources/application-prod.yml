server:
  port: ${PORT:8080}
  # native = Tomcat RemoteIpValve. X-Forwarded-For를 오른쪽(가까운 프록시)부터 읽어서, 신뢰하는 내부 프록시가 아닌
  # 첫 주소를 클라이언트 IP로 쓴다. (framework 방식은 맨 왼쪽 값 = 클라이언트가 마음대로 넣은 값을 그대로 믿어서
  # 헤더만 바꾸면 로그인/인증번호 횟수 제한(RateLimitFilter)을 피할 수 있었다)
  # 사설/CGNAT 대역(10.x, 172.16~31.x, 192.168.x, 100.64~127.x 등)의 프록시는 기본으로 신뢰한다.
  # 배포 플랫폼의 프록시가 이 대역이 아니면 SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES(정규식)로 지정 - DEPLOYMENT.md 참고
  forward-headers-strategy: native

spring:
  application:
    name: cleaneat
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
  jpa:
    # ddl-auto는 application.yml의 validate를 그대로 쓴다 (테이블은 Flyway가 만든다)
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # 메일(인증번호/주문 안내) - 호스트/계정은 환경변수 SPRING_MAIL_HOST / SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD로
  # (스프링이 자동으로 spring.mail.*에 연결한다 - 여기에 빈 기본값을 적으면 "설정 없음"이 아니라 빈 호스트로 인식되므로 적지 않음)
  # SPRING_MAIL_HOST가 없으면 메일 발송 빈이 만들어지지 않아서 인증번호 발송이 실패한다 (DEPLOYMENT.md 5-2 참고)
  mail:
    port: ${SPRING_MAIL_PORT:587}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # 메일 서버가 응답하지 않을 때 요청이 오래 멈춰 있지 않도록
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  jwt:
    # 운영에서는 기본값 없이 강제 - 값이 없으면 기동 시점에 실패해야 함
    secret: ${APP_JWT_SECRET}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:3600000}
  toss:
    # 운영에서는 기본값(공개 테스트 키) 없이 강제 - 값이 없으면 기동 시점에 실패해야 함
    # (테스트 키로 뜨면 실제 돈은 안 나가는데 주문은 "결제 완료"가 된다)
    client-key: ${TOSS_CLIENT_KEY}
    secret-key: ${TOSS_SECRET_KEY}
  mail:
    # 운영에서는 인증번호를 화면에 보여주는 개발 모드를 끈다 - SMTP 환경변수(SPRING_MAIL_HOST, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD 등)가 없으면 메일 발송이 실패함
    dev-mode: false
  openfoodfacts:
    base-url: ${OPENFOODFACTS_BASE_URL:https://world.openfoodfacts.org}
  ocr:
    tessdata-path: ${TESSDATA_PREFIX:/app/tessdata}
    language: ${OCR_LANGUAGE:kor+eng}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

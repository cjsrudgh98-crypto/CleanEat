# 소셜 로그인용 프로필. 기본적으로 비활성 상태이며, 아래 env var를 실제로 채우고
# SPRING_PROFILES_ACTIVE=oauth (운영에서는 prod,oauth) 로 켜야만 동작한다.
# 값이 하나라도 비어있으면 기동 시점에 실패한다 (일부러 강제함) - OAUTH_SETUP.md 참고.
#
# 로컬 개발 편의: backend/application-oauth-secrets.yml(git에 안 올라감, .gitignore 등록됨)이 있으면
# 거기서 실제 키 값을 읽어와서 매번 환경변수를 다시 넣지 않아도 됨. 운영 배포에서는 이 파일 없이
# 실제 환경변수(GOOGLE_CLIENT_ID 등)로 채워야 함.
spring:
  config:
    import: "optional:file:./application-oauth-secrets.yml"
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile,email

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope: profile_nickname,account_email

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope: name,email

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

app:
  # 소셜 로그인 성공 후 리다이렉트할 프론트 주소. 비워두면 같은 origin("/")로 리다이렉트한다
  # (지금 구조처럼 백엔드가 프론트를 같은 origin에서 서빙할 때는 비워두는 게 맞음)
  frontend-url: ${APP_FRONTEND_URL:}

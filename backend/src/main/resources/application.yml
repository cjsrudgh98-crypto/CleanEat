server:
  port: 8080

spring:
  application:
    name: cleaneat
  datasource:
    url: jdbc:h2:mem:cleaneat;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  # 테이블은 Flyway가 만든다 (src/main/resources/db/migration/{h2,mysql,postgresql}/V*__*.sql).
  # 스키마를 바꿀 때는 기존 파일을 고치지 말고 세 벤더 폴더에 같은 버전(V2__설명.sql ...)을 추가한다.
  flyway:
    locations: classpath:db/migration/{vendor}
    # Flyway 도입 전(ddl-auto: update 시절)에 만들어진 DB - 테이블은 있는데 이력이 없으면 V1까지 적용된 것으로 표시만 한다
    # (그런 DB는 먼저 현재 엔티티 기준으로 맞춰 둘 것 - DEPLOYMENT.md "기존 DB를 Flyway로 옮기기")
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # Hibernate는 테이블을 고치지 않고 엔티티와 맞는지 검사만 한다 - 안 맞으면 기동 실패 (마이그레이션 누락을 바로 알 수 있게)
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # 상품 목록처럼 여러 엔티티를 한 번에 읽을 때 연관 데이터(알레르기/식단/상품)를 100개씩 묶어서 조회한다
        # (없으면 상품 47개에 SQL이 143번 나가는 N+1 문제가 생김)
        default_batch_fetch_size: 100
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 헬스체크: GET /actuator/health -> {"status":"UP"} (비로그인 허용, 세부 정보는 숨김)
# /actuator/health/liveness(프로세스 생존), /actuator/health/readiness(요청 받을 준비 - DB 포함)도 있다
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # 메일 서버는 헬스에서 뺀다 - SMTP가 잠깐 안 돼도 주문/조회는 되는데, DOWN으로 보고되면 배포 플랫폼이 서버를 계속 재시작한다
    mail:
      enabled: false

app:
  jwt:
    # 개발용 기본값입니다. 운영 환경에서는 반드시 환경변수(APP_JWT_SECRET)로 재정의하세요.
    secret: ${APP_JWT_SECRET:cleaneat-development-only-jwt-signing-secret-change-in-production}
    expiration-ms: 3600000
  openfoodfacts:
    base-url: https://world.openfoodfacts.org
  ocr:
    tessdata-path: ${TESSDATA_PREFIX:./tessdata}
    language: ${OCR_LANGUAGE:kor+eng}
  toss:
    # 토스페이먼츠 결제위젯 키. 기본값은 토스 개발자센터 문서에 공개된 테스트 키(실제 돈이 나가지 않음).
    # 실제 가맹점 키를 쓸 때는 반드시 환경변수(TOSS_CLIENT_KEY / TOSS_SECRET_KEY)로 넣고 코드에 적지 말 것.
    client-key: ${TOSS_CLIENT_KEY:test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm}
    secret-key: ${TOSS_SECRET_KEY:test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6}
    base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}
  orders:
    # 배송 완료 후 며칠 안에 고객이 반품을 신청할 수 있는지 (전자상거래법 청약철회 기간 7일)
    return-days: ${ORDER_RETURN_DAYS:7}
  admin:
    # 관리자 아이디 (쉼표로 여러 개). 서버 시작/가입 시 ADMIN 권한을 받는다 - 로컬은 *-secrets.yml, 운영은 환경변수로
    usernames: ${ADMIN_USERNAMES:}
  mail:
    # SMTP(spring.mail.*)가 설정되지 않았을 때 메일 대신 서버 로그/화면에 인증번호를 보여주는 개발 모드
    dev-mode: ${MAIL_DEV_MODE:true}
    from: ${MAIL_FROM:no-reply@cleaneat.local}


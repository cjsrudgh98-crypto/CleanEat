# 로컬 MySQL 프로필. SPRING_PROFILES_ACTIVE=mysql (소셜 로그인도 쓰면 oauth,mysql) 로 켠다.
# 기본 프로필(H2 인메모리)과 달리 서버를 껐다 켜도 데이터가 남는다.
#
# 접속 비밀번호는 backend/application-mysql-secrets.yml(git에 안 올라감)에서 읽거나
# 환경변수 MYSQL_PASSWORD 로 넣는다. 테이블은 Flyway가 만든다 (db/migration/mysql, application.yml 참고).
# DB(스키마) 자체는 미리 만들어 둬야 한다:
#   CREATE DATABASE cleaneat_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
spring:
  config:
    import: "optional:file:./application-mysql-secrets.yml"
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:cleaneat_db}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  h2:
    console:
      enabled: false
